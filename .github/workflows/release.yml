name: release

permissions:
  contents: write

on:
  release:
    types: [published]

jobs:
  build:
    name: Release binaries
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install build dependencies
      run: sudo apt install -y libx11-dev libasound2-dev
    - name: Setup Go
      uses: actions/setup-go@v5

    - name: Download dependencies
      run: go mod vendor
    - name: Pack vendor dir
      run: tar -czf wellya-vendor.tar.gz ./vendor
    - name: Upload vendor archive
      uses: svenstaro/upload-release-action@v2
      with:
        file: wellya-vendor.tar.gz
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ github.ref }}
        overwrite: true

    - name: Build linux-amd64
      run: go build -trimpath -ldflags="-w -s -X github.com/wellbou/wellya/ui/model/mainPage.AppVersion=${{ github.ref_name }}" -o wellya
      env:
        GOOS: linux
        GOARCH: amd64
    - name: Upload linux-amd64
      uses: svenstaro/upload-release-action@v2
      with:
        file: wellya
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ github.ref }}
        overwrite: true

    - name: Build linux-amd64-nomedia
      run: go build -trimpath -ldflags="-w -s -X github.com/wellbou/wellya/ui/model/mainPage.AppVersion=${{ github.ref_name }}" -tags=nomedia -o wellya-nomedia
      env:
        GOOS: linux
        GOARCH: amd64
    - name: Upload linux-amd64-nomedia
      uses: svenstaro/upload-release-action@v2
      with:
        file: wellya-nomedia
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ github.ref }}
        overwrite: true

    - name: Build windows-amd64
      run: go build -trimpath -ldflags="-w -s -X github.com/wellbou/wellya/ui/model/mainPage.AppVersion=${{ github.ref_name }}" -o wellya.exe
      env:
        GOOS: windows
        GOARCH: amd64
    - name: Upload windows-amd64
      uses: svenstaro/upload-release-action@v2
      with:
        file: wellya.exe
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ github.ref }}
        overwrite: true

    - name: Build windows-amd64-nomedia
      run: go build -trimpath -ldflags="-w -s -X github.com/wellbou/wellya/ui/model/mainPage.AppVersion=${{ github.ref_name }}" -tags=nomedia -o wellya-nomedia.exe
      env:
        GOOS: windows
        GOARCH: amd64
    - name: Upload windows-amd64
      uses: svenstaro/upload-release-action@v2
      with:
        file: wellya-nomedia.exe
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ github.ref }}
        overwrite: true
